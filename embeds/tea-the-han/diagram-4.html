<script>
  const root = document.documentElement;
  root.classList.add('js');
  const p = document.querySelector('.page');
  const DRAW_LINES = false;   // 이 장은 선 그리기 없이 단계별로 나타나기만
  const reduce = false;   // 윈도우 '애니메이션 효과' 꺼짐 설정과 상관없이 항상 모션 재생 (사용자 요청)
  const fit = () => root.style.setProperty('--s', Math.min(innerWidth / 1920, innerHeight / 1080));
  addEventListener('resize', fit); fit();

  // 선 그림은 그려지듯이 나타난다(점선·마스크 안 도형 제외)
  function draw(el, delay) {
    if (reduce || !DRAW_LINES) return;
    const targets = el.matches('.draw') ? [el] : [...el.querySelectorAll('.draw')];
    targets.forEach(t => t.querySelectorAll('[stroke]:not([stroke="none"]):not([stroke-dasharray])').forEach(s => {
      if (s.closest('mask, clipPath') || !s.getTotalLength) return;
      s.setAttribute('pathLength', '1');
      s.animate([{ strokeDasharray: '1 1', strokeDashoffset: 1 }, { strokeDasharray: '1 1', strokeDashoffset: 0 }],
                { duration: 930, delay, easing: 'cubic-bezier(.5, 0, .2, 1)', fill: 'backwards' });
    }));
  }

  function show(p, upto, { animate = true, stagger = 0 } = {}) {
    p.classList.toggle('instant', !animate);
    p.querySelectorAll('[data-step]').forEach(e => {
      const n = +e.dataset.step;
      if (n <= upto) {
        if (e.classList.contains('shown')) return;
        const delay = stagger * n;
        e.style.transitionDelay = delay ? delay + 'ms' : '';
        e.classList.add('shown');
        if (animate) draw(e, delay);
      } else {
        e.classList.remove('shown');
        e.style.transitionDelay = '';
      }
    });
    if (!animate) requestAnimationFrame(() => requestAnimationFrame(() => p.classList.remove('instant')));
  }

  // 슬라이더가 이 장을 보여줄 때: 발표 순서(data-step)대로 한 단계씩, 앞 단계가 끝나면 다음 단계
  // 선을 그리는 단계는 그려지는 시간(약 0.9초)만큼, 글·사진만 있는 단계는 나타나는 시간만큼 기다린다 (원본의 1.5배 속도)
  const steps = [...new Set([...p.querySelectorAll('[data-step]')].map(e => +e.dataset.step))].sort((a, b) => a - b);
  const hasDraw = n => [...p.querySelectorAll(`[data-step="${n}"]`)].some(e => e.matches('.draw') || e.querySelector('.draw'));
  let timers = [];
  const stop = () => { timers.forEach(clearTimeout); timers = []; };
  window.diagram = {
    play() {
      stop();
      show(p, -1, { animate: false });
      let t = 80;
      steps.forEach(n => {
        timers.push(setTimeout(() => show(p, n), t));
        t += DRAW_LINES && hasDraw(n) ? 1000 : 600;
      });
    },
    rest() { stop(); show(p, Infinity, { animate: false }); }
  };
  const host = window.frameElement;
  // 슬라이더가 화면에 들어와 있고(.in-view) 이 장이 보이는 중일 때만 바로 재생
  (!host || (host.closest('.active') && host.closest('.in-view'))) ? diagram.play() : diagram.rest();
</script>
