<script>
  document.documentElement.classList.add('js');
  const root = document.querySelector('svg');
  const STEPS = [1,2,3];
  let timers = [];
  const stop = () => { timers.forEach(clearTimeout); timers = []; };
  // 단계 upto까지 보이기 (animate=false면 바로)
  function show(upto, animate) {
    root.classList.toggle('instant', !animate);
    root.querySelectorAll('.step').forEach(g => g.classList.toggle('shown', +g.dataset.step <= upto));
    if (!animate) requestAnimationFrame(() => requestAnimationFrame(() => root.classList.remove('instant')));
  }
  // 슬라이더가 이 장을 보여줄 때 처음부터 한 단계씩, 다른 장일 때는 완성된 모습
  window.diagram = {
    play() {
      stop(); show(-1, false);
      STEPS.forEach((s, i) => timers.push(setTimeout(() => show(s, true), 80 + i * 600)));
    },
    rest() { stop(); show(Infinity, false); }
  };
  const host = window.frameElement;
  (!host || (host.closest('.active') && host.closest('.in-view'))) ? diagram.play() : diagram.rest();
</script>
